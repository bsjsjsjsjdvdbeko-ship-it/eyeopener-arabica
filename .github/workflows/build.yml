name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Android SDK packages
      run: |
        SDKMANAGER=/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
        if [ ! -f "$SDKMANAGER" ]; then
          SDKMANAGER=$(find /usr/local/lib/android/sdk -name sdkmanager -type f | head -1)
        fi
        yes | $SDKMANAGER --licenses > /dev/null 2>&1 || true
        $SDKMANAGER "platforms;android-36" "build-tools;36.0.0" "platform-tools"

    - name: Decode Keystore from file
      run: |
        base64 -d app/eye-release.jks.base64 > eye-release.jks
        ls -la eye-release.jks

    - name: Create keystore.properties
      run: |
        cat > keystore.properties << KEOF
        storeFile=eye-release.jks
        storePassword=${{ secrets.KEYSTORE_PASSWORD }}
        keyAlias=${{ secrets.KEY_ALIAS }}
        keyPassword=${{ secrets.KEY_PASSWORD }}
        KEOF

    - name: Grant execute permission
      run: chmod +x gradlew

    - name: Build Release APK
      run: ./gradlew assembleRelease -x lint -x lintDebug -x test --no-daemon

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: EyeOpener-Release
        path: app/build/outputs/apk/release/*.apk
