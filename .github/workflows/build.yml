name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Android SDK packages
      run: |
        SDKMANAGER=/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
        if [ ! -f "$SDKMANAGER" ]; then
          SDKMANAGER=$(find /usr/local/lib/android/sdk -name sdkmanager -type f | head -1)
        fi
        echo "Using sdkmanager: $SDKMANAGER"
        yes | $SDKMANAGER --licenses > /dev/null 2>&1 || true
        $SDKMANAGER "platforms;android-36" "build-tools;36.0.0" "platform-tools"

    - name: Grant execute permission
      run: chmod +x gradlew

    - name: Build APK
      run: ./gradlew assembleDebug -x lint -x lintDebug -x test --no-daemon

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: EyeOpener-Debug
        path: app/build/outputs/apk/debug/*.apk
